[package]
name = "six-ten"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Coordinates file edits between coding agents (Claude Code, Codex, OpenCode, Hermes, ...) sharing one git checkout"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cullen-b/six-ten"
readme = "README.md"
keywords = ["agents", "claude-code", "codex", "mcp", "git"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fs4 = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
